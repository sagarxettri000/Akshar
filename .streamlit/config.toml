# Akshar theme — the Streamlit half of the design system.
#
# These colours are the same values as `ui.TOKENS` and the custom properties in
# `landing/styles.css`; `tests/test_design_tokens.py` fails if the three drift
# apart. Edit the palette in `ui.py` first, then mirror it here.
[theme]
base = "light"
primaryColor = "#0f6e5a"             # brand — actions, links, focus
backgroundColor = "#ffffff"          # surface
secondaryBackgroundColor = "#f7f6f3" # surface-sunken — sidebar, notes
textColor = "#14201d"                # ink
linkColor = "#0b5646"                # brand-strong
linkUnderline = true
borderColor = "#e4e2dc"              # border
codeBackgroundColor = "#f7f6f3"
codeTextColor = "#0b5646"

# A compact radius scale: controls are rounded rectangles, not pills.
baseRadius = "0.5rem"
buttonRadius = "0.5rem"

# 16px body text; headings step down in a restrained scale.
baseFontSize = 16
headingFontSizes = ["1.5rem", "1.75rem", "1.25rem", "1.0625rem", "1rem", "0.875rem"]
headingFontWeights = [700, 700, 650, 650, 600, 600]

showWidgetBorder = true
showSidebarBorder = true

# Stay on the system sans-serif stack (no webfont to download) so Devanagari
# renders with the reader's own Noto/Nirmala glyphs — important on the modest
# devices and connections Akshar targets, and it keeps Latin and Devanagari
# metrics consistent with the landing page.
font = "system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans Devanagari', 'Nirmala UI', Arial, sans-serif"

[browser]
gatherUsageStats = false
